site_name: sewpat
site_url: https://lewekesarah.github.io/sewpatgen/
site_description: Python library for generating sewing patterns as SVG/PDF
site_author: Sarah Leweke & Samuel Leweke
repo_url: https://github.com/LewekeSarah/sewpatgen
repo_name: LewekeSarah/sewpatgen
edit_uri: ""

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_signature_annotations: true
            show_source: false
            merge_init_into_class: true
            show_root_heading: true

nav:
  - Home: index.md
  - Guides:
      - Darts: guides/darts.md
  - API Reference:
      - Geometry: api/geometry.md
      - Patterns & Pattern Parts: api/pattern.md
      - Measurements & Fit Classes: api/measurements.md
      - Person: api/person.md
      - Style & Rendering: api/style.md
      - Pages & Units: api/pages.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - toc:
      permalink: true
