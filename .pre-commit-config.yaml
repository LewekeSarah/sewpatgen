# Pre-commit hooks for sewpat
# Mirrors the CI pipeline (.github/workflows/ci.yml) so every local commit
# gets the same checks that will run on GitHub before they ever hit the remote.
#
# Install once per clone:
#   uv run pre-commit install
#
# Run manually against all files:
#   uv run pre-commit run --all-files
#
# Note: mypy is intentionally NOT run as a pre-commit hook.
# It has ~166 pre-existing [operator] / [union-attr] errors that are tracked
# as a separate backlog item.  mypy continues to run in CI for visibility.

default_language_version:
  python: python3.14

repos:
  # ── Basic file hygiene ────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Ensure files end with a newline
      - id: check-yaml
        name: Validate YAML syntax
      - id: check-toml
        name: Validate TOML syntax
      - id: check-merge-conflict
        name: Detect merge-conflict markers
      - id: debug-statements
        name: Detect leftover debug statements (pdb, breakpoint)

  # ── Ruff — lint + auto-fix ────────────────────────────────────────────────
  # Uses the same version pinned in pyproject.toml / uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        name: Ruff — lint
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: Ruff — format
