name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/sewpat/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.14

      - name: Install dependencies (no dev group needed for build)
        run: uv sync

      - name: Run CI checks before release
        run: |
          uv sync --group dev
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy src/sewpat/ --ignore-missing-imports
          uv run pytest --cov=sewpat --cov-fail-under=80

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}

